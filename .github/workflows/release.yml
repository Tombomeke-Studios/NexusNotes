name: Release

# Builds the Windows installers of the desktop app and publishes them, with
# their SHA-256 checksums, as a GitHub release (#557).
#
# - Pushing a `vX.Y.Z` tag (on main, matching the VERSION file) builds and
#   publishes the release.
# - Running it by hand (workflow_dispatch) is a dry run: it builds the
#   installers and keeps them as a workflow artifact, but publishes nothing.
#
# There is no pull_request trigger: nothing here runs on code from a PR, and
# only the publish job, which runs no project code, gets a write token.
# Every action is pinned to a full commit SHA. Dependency caches are off, so a
# release never restores a cache another workflow could have written.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history, so the tag can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the VERSION file ($version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG does not point at a commit on main"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/sync-service/go.mod
          cache: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # tauri.conf.json's beforeBuildCommand builds the sync-service sidecar
      # (scripts/build-sidecar.js, for externalBin) and the web UI, then
      # bundles the MSI and NSIS installers.
      - name: Build the installers
        working-directory: desktop
        env:
          # The REST client finds the sidecar on its own (lib/apiBase.ts), but the
          # sync client would take the WebSocket host from the window's origin
          # (tauri.localhost) until #504 derives it from the configured origin.
          VITE_WS_URL: ws://localhost:8080
        run: npm run tauri -- build

      - name: Collect the installers and their checksums
        run: |
          mkdir release
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe release/
          cp desktop/src-tauri/target/release/bundle/msi/*.msi release/
          cd release
          # Git Bash's sha256sum marks binary mode with '*'; write the plain
          # "<hash>  <file>" form that sha256sum -c and people both read.
          sha256sum -- *.exe *.msi | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: release

      - name: Verify the checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          setup="$(cd release && ls -- *.exe | head -n 1)"
          {
            echo "## Install on Windows"
            echo
            echo "Download \`$setup\` (or the \`.msi\`) below. Docker Desktop is the only prerequisite."
            echo
            echo "> [!WARNING]"
            echo "> **The installer is not code-signed yet.** Code signing is tracked in #529."
            echo "> Until it lands, Windows SmartScreen shows **\"Windows protected your PC\"** when you"
            echo "> start the installer. Click **More info**, then **Run anyway**. Check the file's"
            echo "> checksum first (below), so you know it is the file this release published."
            echo
            echo "### Verify the download"
            echo
            echo "In PowerShell, in the folder you downloaded the installer to:"
            echo
            echo '```powershell'
            printf 'Get-FileHash .\\%s -Algorithm SHA256\n' "$setup"
            echo '```'
            echo
            echo "The \`Hash\` it prints must match the installer's line in \`SHA256SUMS.txt\`, attached"
            echo "to this release. \`Get-FileHash\` prints upper case and the file lower case; only the"
            echo "characters have to match. If they differ, delete the download and do not run it."
            echo
            echo "## What's new"
            echo
            # The release's own section of the changelog, without its heading
            # or the compare links at the end of the file.
            section="$(awk -v head="## [$version]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]*\]: / { next }
              found { print }
            ' CHANGELOG.md)"
            if [ -n "$section" ]; then
              echo "$section"
            else
              echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          # v1.2.0-rc.1 and the like are marked as pre-releases.
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "NexusNotes $TAG" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
