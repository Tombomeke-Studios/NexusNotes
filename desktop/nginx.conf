server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # $http_host (not $host) keeps the port: the sync service matches the
    # WebSocket Origin (e.g. http://localhost:3000) against Host, and $host
    # would strip it to "localhost", failing the same-origin check with 403.
    location /api/ {
        proxy_pass http://sync-service:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://sync-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://sync-service:8080;
    }
}
