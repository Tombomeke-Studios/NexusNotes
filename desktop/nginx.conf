server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same policy as the desktop webview (#329, #382): scripts only from the
    # app, no eval, frames or form posts; network only to this origin (the
    # /api and /ws proxies below). 'self' covers ws:/wss: on the same host in
    # current browsers; the explicit entries keep older ones working.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # $http_host (not $host) keeps the port: the sync service matches the
    # WebSocket Origin (e.g. http://localhost:3000) against Host, and $host
    # would strip it to "localhost", failing the same-origin check with 403.
    location /api/ {
        proxy_pass http://sync-service:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://sync-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MCP server for AI clients (#221). Resolved per request through Docker's
    # DNS, so the web UI still starts when the mcp-service is not deployed
    # (/mcp then answers 502). Responses may stream: no buffering.
    location /mcp {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mcp_upstream http://mcp-service:8081;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://sync-service:8080;
    }
}
