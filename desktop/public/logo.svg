<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b4befe" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="nodeglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#cba6f7" stroke-width="1">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Connection lines (edges) forming the N shape -->
  <g stroke="url(#accent)" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <!-- Left vertical of N -->
    <line x1="156" y1="140" x2="156" y2="248"/>
    <line x1="156" y1="248" x2="156" y2="372"/>
    <!-- Diagonal of N -->
    <line x1="156" y1="140" x2="260" y2="256"/>
    <line x1="260" y1="256" x2="356" y2="372"/>
    <!-- Right vertical of N -->
    <line x1="356" y1="140" x2="356" y2="248"/>
    <line x1="356" y1="248" x2="356" y2="372"/>
    <!-- Cross connections (knowledge graph feel) -->
    <line x1="156" y1="248" x2="260" y2="256"/>
    <line x1="260" y1="256" x2="356" y2="248"/>
    <line x1="156" y1="140" x2="356" y2="140"/>
    <line x1="156" y1="372" x2="356" y2="372"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#nodeglow)">
    <!-- Left vertical nodes -->
    <circle cx="156" cy="140" r="16" fill="url(#accent)"/>
    <circle cx="156" cy="248" r="12" fill="url(#accent)"/>
    <circle cx="156" cy="372" r="16" fill="url(#accent)"/>

    <!-- Center node (intersection) -->
    <circle cx="260" cy="256" r="20" fill="url(#accent)"/>
    <circle cx="260" cy="256" r="10" fill="#1e1e2e"/>

    <!-- Right vertical nodes -->
    <circle cx="356" cy="140" r="16" fill="url(#accent)"/>
    <circle cx="356" cy="248" r="12" fill="url(#accent)"/>
    <circle cx="356" cy="372" r="16" fill="url(#accent)"/>
  </g>

  <!-- Small decorative satellite nodes -->
  <g opacity="0.5">
    <circle cx="108" cy="180" r="5" fill="#89b4fa"/>
    <line x1="108" y1="180" x2="156" y2="200" stroke="#89b4fa" stroke-width="1.5" opacity="0.3"/>
    <circle cx="400" cy="310" r="5" fill="#89b4fa"/>
    <line x1="400" y1="310" x2="356" y2="330" stroke="#89b4fa" stroke-width="1.5" opacity="0.3"/>
    <circle cx="210" cy="160" r="4" fill="#f5c2e7"/>
    <line x1="210" y1="160" x2="200" y2="190" stroke="#f5c2e7" stroke-width="1" opacity="0.3"/>
    <circle cx="310" cy="350" r="4" fill="#a6e3a1"/>
    <line x1="310" y1="350" x2="320" y2="362" stroke="#a6e3a1" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
