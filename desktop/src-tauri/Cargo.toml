[package]
name = "nexusnotes"
version = "0.1.0"
description = "A markdown-first note-taking platform"
authors = ["Tombomeke Studios"]
edition = "2021"

[lib]
name = "nexusnotes_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
