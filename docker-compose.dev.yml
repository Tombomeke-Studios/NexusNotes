services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_dev
      - POSTGRES_DB=nexus_notes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_notes"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=nexus_minio
      - MINIO_ROOT_PASSWORD=nexus_minio_dev

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7700:7700"
    volumes:
      - meili_dev_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=dev-master-key
      - MEILI_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  meili_dev_data:
