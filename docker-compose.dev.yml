# Also bundled into the packaged desktop app. Every port is published on
# 127.0.0.1 only: these services use fixed development credentials (and Redis
# none at all), so they must never be reachable from the network (#260).
services:
  postgres:
    image: postgres:16-alpine
    # Come back with Docker Desktop so the packaged app finds its infra ready.
    restart: unless-stopped
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_dev
      - POSTGRES_DB=nexus_notes
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_notes"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # minio/minio and quay.io/minio/minio both deny anonymous pulls now (#248);
    # this Bitnami build is the same upstream binary and stays public.
    image: bitnamilegacy/minio:latest
    # Bitnami's default non-root user can't init /data under Docker Desktop's
    # volume driver here; root avoids that without changing behaviour.
    user: root
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=nexus_minio
      - MINIO_ROOT_PASSWORD=nexus_minio_dev

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_dev_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=dev-master-key
      - MEILI_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  meili_dev_data:
