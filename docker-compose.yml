# Production stack. Secrets have no defaults: `docker compose` refuses to start
# until they are set in .env (copy .env.production.example; see
# docs/deployment.md). Only the web UI is published; everything else stays on
# the internal network. Monitoring is opt-in: docker-compose.monitoring.yml.

x-limits: &small
  deploy:
    resources:
      limits:
        memory: 256M

services:
  desktop:
    build:
      context: ./desktop
      dockerfile: Dockerfile
    ports:
      - "${NEXUS_HTTP_PORT:-3000}:80"
    depends_on:
      - sync-service
    restart: unless-stopped
    <<: *small

  sync-service:
    build:
      context: ./services/sync-service
      dockerfile: Dockerfile
      args:
        # Reported by /health; export from the VERSION file (see docs/deployment.md#versioning).
        VERSION: ${NEXUS_VERSION:-dev}
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://nexus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/nexus_notes?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
      # Encrypts user data at rest; back it up separately from the database.
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      - DATA_ENCRYPTION_OLD_KEYS=${DATA_ENCRYPTION_OLD_KEYS:-}
      - REDIS_URL=redis://redis:6379
      # The web UI's nginx is the only way in, so trust the compose network's
      # private ranges for X-Forwarded-For / X-Real-IP; otherwise every user
      # would share one rate-limit bucket (#373). Add an outer proxy here if
      # one sits in front of the web UI.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      # Guards /api/admin/*; leave empty to disable those endpoints.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Transactional email (#50). Leave SMTP_HOST empty to disable email
      # (mail is logged, and email verification is not enforced). APP_BASE_URL
      # is the public origin used to build the links in verification/reset mails.
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Attachment object storage (#153), on the internal network only.
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-nexus_minio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - MINIO_BUCKET=${MINIO_BUCKET:-attachments}
      # Browser origins allowed for CORS and the WebSocket handshake, comma
      # separated. Empty = desktop app + local dev defaults; the web UI on
      # :3000 is proxied same-origin and needs no entry.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Let the linked-file URL proxy fetch private/LAN addresses (off by default).
      - LINKED_FILES_ALLOW_PRIVATE=${LINKED_FILES_ALLOW_PRIVATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # MCP server for AI clients (#221), reached through the web UI at /mcp.
  # It holds no secrets: each request carries the user's MCP token, which it
  # passes on to the sync service.
  mcp-service:
    build:
      context: ./services/mcp-service
      dockerfile: Dockerfile
    environment:
      - NEXUSNOTES_API_URL=http://sync-service:8080
      - MCP_HTTP_ADDR=:8081
    depends_on:
      - sync-service
    restart: unless-stopped
    <<: *small

  postgres:
    image: postgres:16.14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nexus
      # Only applied when the volume is first created; see docs/deployment.md
      # for changing the password of an existing database.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=nexus_notes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_notes"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.4.9-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    <<: *small

  minio:
    # minio/minio and quay.io/minio/minio both deny anonymous pulls now (#248);
    # this Bitnami build is the same upstream binary and stays public.
    image: bitnamilegacy/minio:2025.5.24
    # Bitnami's default non-root user can't init a fresh named volume here;
    # root avoids that without changing behaviour.
    user: root
    command: server /data
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-nexus_minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    volumes:
      - meili_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      - MEILI_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:
