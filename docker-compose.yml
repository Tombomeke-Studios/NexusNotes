services:
  desktop:
    build:
      context: ./desktop
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - sync-service
    restart: unless-stopped

  sync-service:
    build:
      context: ./services/sync-service
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://nexus:nexus_pass@postgres:5432/nexus_notes?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_pass
      - POSTGRES_DB=nexus_notes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_notes"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=nexus_minio
      - MINIO_ROOT_PASSWORD=nexus_minio_pass
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
